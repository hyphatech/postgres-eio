# The test database: empty on every start (tmpfs), durability off for speed.
# Certificates and pg_hba.conf are baked into the image, not bind-mounted,
# so worktrees share one container instead of recreating it.
name: postgres-eio

services:
  db:
    build: test/postgres
    image: postgres-eio-test
    environment:
      POSTGRES_USER: postgres_eio
      POSTGRES_PASSWORD: postgres_eio
      POSTGRES_DB: postgres_eio
    # Not 5432, so a local Postgres is never tested by mistake.
    ports:
      - "${PG_TEST_PORT:-5435}:5432"
    tmpfs:
      - /var/lib/postgresql
    command:
      - postgres
      - -c
      - fsync=off
      - -c
      - synchronous_commit=off
      - -c
      - full_page_writes=off
      - -c
      - ssl=on
      - -c
      - ssl_cert_file=/etc/postgres-test/server.crt
      - -c
      - ssl_key_file=/etc/postgres-test/server.key
      - -c
      - ssl_ca_file=/etc/postgres-test/client-ca.crt
      - -c
      - hba_file=/etc/postgres-test/pg_hba.conf
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres_eio -d postgres_eio"]
      interval: 1s
      timeout: 3s
      retries: 30

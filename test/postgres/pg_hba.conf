# One role per sign-in method; the tests create the roles. Everything else
# is SCRAM. The local socket is trusted for initialisation and healthchecks.
#
# TYPE   DATABASE  USER             ADDRESS  METHOD
local    all       all                       trust
host     all       pgeio_md5        all      md5
hostssl  all       pgeio_cleartext  all      password
hostssl  all       pgeio_cert       all      cert
host     all       pgeio_trust      all      trust
host     all       all              all      scram-sha-256
